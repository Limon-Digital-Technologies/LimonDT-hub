[package]
name = "limon-digital-tech-hub"
version = "0.2.0"
description = "Limon Digital Technologies workspace hub"
authors = ["Limon Digital Technologies"]
edition = "2021"

[lib]
name = "limon_digital_tech_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2.8.3"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde_json = "1"

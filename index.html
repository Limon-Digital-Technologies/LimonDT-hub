<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="Единое пространство приложений Limon Digital Technologies." />
    <title>Limon Digital Tech. Hub</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #f3f5f9; }
      body { overflow: hidden; }
      #app { visibility: hidden; }
      html.app-ready #app { visibility: visible; }
      html.app-ready body { overflow: auto; }
      #startup-screen {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        min-width: 760px;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 16% 12%, rgba(114,157,255,.2), transparent 34%),
          radial-gradient(ellipse at 88% 90%, rgba(124,219,190,.18), transparent 32%),
          #f3f5f9;
        color: #242a36;
        font-family: "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity .24s ease;
      }
      #startup-screen.is-leaving { opacity: 0; pointer-events: none; }
      .startup-card {
        display: flex;
        width: min(390px, calc(100% - 48px));
        flex-direction: column;
        align-items: center;
        padding: 34px 32px 28px;
        border: 1px solid rgba(255,255,255,.9);
        border-radius: 24px;
        background: rgba(255,255,255,.88);
        box-shadow: 0 24px 70px rgba(39,57,91,.12), inset 0 1px rgba(255,255,255,.95);
      }
      .startup-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 19px;
        border-radius: 19px;
        box-shadow: 0 8px 22px rgba(40,74,145,.2);
      }
      .startup-title { font-size: 17px; font-weight: 700; letter-spacing: -.35px; }
      .startup-caption { margin-top: 6px; color: #8992a1; font-size: 11px; }
      .startup-indicator {
        width: 100%;
        height: 3px;
        margin-top: 25px;
        overflow: hidden;
        border-radius: 3px;
        background: #e8edf5;
      }
      .startup-indicator::after {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #5499f6, #745fe8);
        animation: startup-progress 1.25s ease-in-out infinite;
        content: "";
      }
      @keyframes startup-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(290%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-screen { transition: none; }
        .startup-indicator::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="startup-screen" role="status" aria-live="polite">
      <div class="startup-card">
        <img class="startup-logo" src="/assets/HubLogo.png" alt="" />
        <span class="startup-title">Limon Digital Tech. Hub</span>
        <span class="startup-caption">Подготавливаем рабочее пространство</span>
        <span class="startup-indicator" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

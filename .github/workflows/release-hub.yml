name: Publish Limon Hub

on:
  push:
    tags:
      - "hub-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Hub tests
        run: npm test

      - name: Publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_UPDATER_ENABLED: "false"
        with:
          tagName: hub-v__VERSION__
          releaseName: Limon Hub v__VERSION__
          releaseBody: |
            ## Install Limon Hub on Windows

            [Download Limon-Hub-windows-x64.msi](https://github.com/Limon-Digital-Technologies/LimonDT-hub/releases/latest/download/Limon-Hub-windows-x64.msi), open the downloaded file, and follow the Windows Installer prompts.

            The Hub is separate from the apps in its catalog. Install only the apps you choose from inside the Hub.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --bundles msi

      - name: Add direct-download installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" |
            Where-Object { $_.Name -match "_en-US\.msi$" } |
            Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" |
              Select-Object -First 1
          }
          if (-not $installer) {
            throw "Tauri did not produce a Windows MSI."
          }

          $downloadName = "Limon-Hub-windows-x64.msi"
          Copy-Item $installer.FullName $downloadName
          $hash = (Get-FileHash $downloadName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "$downloadName.sha256",
            "$hash  $downloadName",
            [System.Text.Encoding]::ASCII
          )
          gh release upload $env:GITHUB_REF_NAME $downloadName "$downloadName.sha256" --clobber
